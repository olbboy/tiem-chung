<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Rounded background -->
  <rect width="512" height="512" rx="102" fill="url(#bgGradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="30" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="412" cy="412" r="40" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="440" cy="80" r="20" fill="#10B981" opacity="0.15"/>
  <circle cx="70" cy="440" r="25" fill="#10B981" opacity="0.15"/>
  
  <!-- Main Icon Group -->
  <g transform="translate(256, 256)" filter="url(#shadow)">
    <!-- Shield background -->
    <path d="M0 -120 C80 -120 100 -140 100 -140 L100 -40 C100 20 60 80 0 100 C-60 80 -100 20 -100 -40 L-100 -140 C-100 -140 -80 -120 0 -120 Z" 
          fill="#FFFFFF" opacity="0.95"/>
    
    <!-- Syringe -->
    <g transform="translate(-25, -35) scale(1.4)">
      <!-- Syringe body -->
      <rect x="20" y="10" width="30" height="50" rx="4" fill="#4F46E5" stroke="#3730A3" stroke-width="2"/>
      <rect x="22" y="12" width="26" height="15" rx="2" fill="#6366F1"/>
      
      <!-- Liquid inside -->
      <rect x="25" y="30" width="20" height="25" rx="2" fill="#10B981" opacity="0.7"/>
      
      <!-- Plunger -->
      <rect x="32" y="0" width="6" height="15" rx="1" fill="#4F46E5"/>
      <rect x="29" y="-5" width="12" height="8" rx="2" fill="#6366F1"/>
      
      <!-- Needle -->
      <path d="M35 60 L35 80 L37 82 L35 84 L33 82 L35 80 Z" fill="#94A3B8" stroke="#64748B" stroke-width="1"/>
      <circle cx="35" cy="84" r="3" fill="#10B981"/>
      
      <!-- Measurement marks -->
      <line x1="23" y1="35" x2="27" y2="35" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
      <line x1="23" y1="42" x2="27" y2="42" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
      <line x1="23" y1="49" x2="27" y2="49" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
    </g>
    
    <!-- Checkmark badge -->
    <circle cx="40" cy="50" r="28" fill="#10B981" stroke="#FFFFFF" stroke-width="6"/>
    <path d="M25 50 L35 60 L60 35" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  
  <!-- Bottom decoration - subtle pulse effect circles -->
  <circle cx="256" cy="480" r="8" fill="#FFFFFF" opacity="0.3"/>
  <circle cx="240" cy="480" r="6" fill="#FFFFFF" opacity="0.2"/>
  <circle cx="272" cy="480" r="6" fill="#FFFFFF" opacity="0.2"/>
</svg>

